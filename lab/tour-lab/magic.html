<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Listening</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="magic.css" />
</head>
<body>
<main id="main">

  <!-- Scene 1 · the ask. A question put to a room, not a form put to a machine. -->
  <section id="ask" class="scene on">
    <h1 class="ask-line">What are you carrying into the text?</h1>
    <div class="ask-field">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             aria-label="Bring a question, a passage, or a heaviness" />
    </div>
    <p class="ask-hint">a question · a passage · a word · a heaviness</p>
    <div class="ask-examples" aria-label="examples">
      <button class="eg">Walk me through Genesis 6:1–4</button>
      <button class="eg">My mother died and I cannot pray</button>
      <button class="eg">What does hesed actually mean?</button>
    </div>
  </section>

  <!-- Scene 2 · the making. One quiet line at a time, in honest past-tense of
       what the pipeline is actually doing. No bar, no percent, no spinner. -->
  <section id="making" class="scene">
    <p id="making-line" class="making-line" role="status" aria-live="polite" aria-atomic="true"></p>
    <div id="making-marks" class="making-marks" aria-hidden="true"></div>
  </section>

  <!-- Scene 3 · the tour. A made thing, laid out like a gift. -->
  <section id="tour" class="scene">
    <header class="tour-head">
      <p class="tour-over">A listening tour · <span id="tour-length"></span></p>
      <h2 id="tour-title"></h2>
      <p id="tour-intro" class="prose"></p>
    </header>
    <ol id="steps" class="steps"></ol>
    <p id="tour-closing" class="prose closing"></p>
    <p class="again"><button id="again" class="quiet-link">Ask something else</button></p>
  </section>

</main>

<!-- The theater: when a reading plays, the page becomes the stage. Controls
     minimize to one quiet bar; the texts get the room. -->
<section id="theater" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Now playing" tabindex="-1">
  <header class="th-head">
    <span class="th-source"></span>
    <span class="th-title"></span>
  </header>
  <p class="th-whisper"></p>
  <div class="th-body" aria-busy="false">
    <div class="shot-frame" data-editorial-slot="current">
      <div class="scripture-stage">
        <blockquote class="verses"></blockquote>
      </div>
      <section class="thought-stage" data-visual-slot="thought" aria-live="polite" aria-atomic="true">
        <div class="thought-outgoing" aria-hidden="true"></div>
        <div class="thought-current"></div>
      </section>
    </div>
  </div>
  <p class="caption" aria-live="off"></p>
  <footer class="th-controls">
    <button id="th-stop" class="play" aria-label="Stop">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
        <rect x="1.5" y="1.5" width="9" height="9" rx="1"></rect>
      </svg>
    </button>
    <button id="th-back" class="th-jump" aria-label="Back 15 seconds">−15</button>
    <div class="th-progress" role="slider" tabindex="0" aria-label="Position"
         aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="Not playing"><i></i></div>
    <button id="th-fwd" class="th-jump" aria-label="Forward 15 seconds">+15</button>
  </footer>
</section>

<audio id="player" preload="none"></audio>
<script type="module" src="magic.js"></script>
</body>
</html>
